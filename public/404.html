<!doctype html>
<html lang="fr">
  <head>
    <meta charset="UTF-8" />
    <meta name="viewport" content="width=device-width, initial-scale=1.0" />
    <meta name="robots" content="noindex" />
    <title>Page introuvable · Page not found | Yoel PEPIN</title>
    <link rel="icon" href="/favicon.ico" sizes="48x48" />
    <style>
      html, body { height: 100%; margin: 0; }
      body {
        display: flex; align-items: center; justify-content: center; padding: 24px; box-sizing: border-box;
        font-family: Inter, system-ui, -apple-system, "Segoe UI", Roboto, sans-serif; color: #fff;
        background:
          radial-gradient(ellipse 60% 50% at 85% 10%, rgba(110, 8, 90, 0.7), transparent 70%),
          radial-gradient(ellipse 60% 50% at 10% 95%, rgba(70, 10, 110, 0.7), transparent 70%),
          #050208;
      }
      main { max-width: 560px; text-align: center; }
      .code {
        font-size: clamp(72px, 18vw, 140px); font-weight: 700; letter-spacing: -0.04em; line-height: 1;
        background: linear-gradient(90deg, #a78bfa, #67e8f9); -webkit-background-clip: text; background-clip: text; color: transparent;
      }
      h1 { margin: 20px 0 6px; font-size: 26px; font-weight: 600; }
      p { margin: 0; color: #a1a1aa; line-height: 1.6; }
      .liens { margin-top: 32px; display: flex; flex-wrap: wrap; gap: 12px; justify-content: center; }
      a {
        color: #fff; text-decoration: none; font-weight: 600; padding: 12px 22px; border-radius: 999px;
        border: 1px solid rgba(255, 255, 255, 0.18); background: rgba(255, 255, 255, 0.06);
      }
      a:hover { background: rgba(255, 255, 255, 0.14); }
      a.principal { border: 0; background: linear-gradient(90deg, #7c3aed, #06b6d4); }
    </style>
  </head>
  <body>
    <main>
      <div class="code" aria-hidden="true">404</div>
      <h1>Page introuvable · <span lang="en">Page not found</span></h1>
      <p>Cette page n'existe pas ou a été déplacée.</p>
      <p lang="en">This page doesn't exist or has been moved.</p>
      <div class="liens">
        <a class="principal" href="/">Retour à l'accueil</a>
        <a href="/en/" lang="en" hreflang="en">Back to home (English)</a>
      </div>
    </main>
  </body>
</html>
