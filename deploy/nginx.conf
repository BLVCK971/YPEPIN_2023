# /etc/nginx/sites-available/ypepin.com
# Site purement statique : aucun code exécuté côté serveur.
server {
    listen 80;
    listen [::]:80;
    server_name ypepin.com www.ypepin.com;

    root /var/www/ypepin.com;
    index index.html;

    server_tokens off;
    autoindex off;

    add_header X-Content-Type-Options "nosniff" always;
    add_header X-Frame-Options "SAMEORIGIN" always;
    add_header Referrer-Policy "strict-origin-when-cross-origin" always;
    add_header Permissions-Policy "camera=(), microphone=(), geolocation=()" always;

    # Seules les méthodes de lecture sont acceptées
    if ($request_method !~ ^(GET|HEAD)$) {
        return 405;
    }

    # Pas de fichiers cachés (.git, .env, ...)
    location ~ /\. {
        deny all;
    }

    location /assets/ {
        expires 1y;
        add_header Cache-Control "public, immutable";
        add_header X-Content-Type-Options "nosniff" always;
    }

    location / {
        try_files $uri $uri/ =404;
    }
}
