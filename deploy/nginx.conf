# Config nginx interne au conteneur : sert uniquement le build statique.
# Le TLS, le nom de domaine et le routing sont gérés par Traefik en amont
# (même VPS et même Traefik que ARC-GR) — pas de server_name ni de TLS ici.

server {
    listen 80;
    server_name _;

    root /usr/share/nginx/html;
    index index.html;

    server_tokens off;
    autoindex off;

    add_header X-Content-Type-Options "nosniff" always;
    add_header X-Frame-Options "SAMEORIGIN" always;
    add_header Referrer-Policy "strict-origin-when-cross-origin" always;
    add_header Permissions-Policy "camera=(), microphone=(), geolocation=()" always;

    # Site 100 % statique : seules les méthodes de lecture sont acceptées.
    if ($request_method !~ ^(GET|HEAD)$) {
        return 405;
    }

    # Pas de fichiers cachés (.git, .env, ...)
    location ~ /\. {
        deny all;
    }

    # Pas de fallback SPA : le site est une seule page (ancres #Parcours,
    # #Portofolio) + des démos statiques dans /Web et /py.
    location / {
        try_files $uri $uri/ =404;
    }

    # Cache long pour les assets hashés par Vite (immutables entre builds).
    # add_header dans un location annule ceux du server : on les répète.
    location /assets/ {
        expires 1y;
        add_header Cache-Control "public, immutable";
        add_header X-Content-Type-Options "nosniff" always;
    }

    gzip on;
    gzip_types text/css application/javascript image/svg+xml application/json;
}
