# Config nginx interne au conteneur : sert uniquement le build statique.
# Le TLS, le nom de domaine et le routing sont gérés par Traefik en amont
# (même VPS et même Traefik que ARC-GR) — pas de server_name ni de TLS ici.

server {
    listen 80;
    server_name _;

    root /usr/share/nginx/html;
    index index.html;

    server_tokens off;
    autoindex off;

    add_header X-Content-Type-Options "nosniff" always;
    add_header X-Frame-Options "SAMEORIGIN" always;
    add_header Referrer-Policy "strict-origin-when-cross-origin" always;
    add_header Permissions-Policy "camera=(), microphone=(), geolocation=()" always;

    # Site 100 % statique : seules les méthodes de lecture sont acceptées.
    if ($request_method !~ ^(GET|HEAD)$) {
        return 405;
    }

    # Pas de fichiers cachés (.git, .env, ...)
    location ~ /\. {
        deny all;
    }

    # Pas de fallback SPA : le site est une seule page (ancres #Parcours,
    # #Portfolio) + des démos statiques dans /Web et /py.
    location / {
        try_files $uri $uri/ =404;
    }

    # Page principale (prérendue au build) : CSP stricte. Les démos /Web et /py
    # chargent des scripts externes (CDN pygame-web...) et n'ont donc pas cette CSP.
    # add_header dans un location annule ceux du server : on les répète.
    location = /index.html {
        add_header Content-Security-Policy "default-src 'self'; script-src 'self'; style-src 'self' 'unsafe-inline'; img-src 'self' data:; media-src 'self'; font-src 'self'; connect-src 'self'; object-src 'none'; base-uri 'self'; form-action 'none'; frame-ancestors 'self'; upgrade-insecure-requests" always;
        add_header Cache-Control "no-cache" always;
        add_header X-Content-Type-Options "nosniff" always;
        add_header X-Frame-Options "SAMEORIGIN" always;
        add_header Referrer-Policy "strict-origin-when-cross-origin" always;
        add_header Permissions-Policy "camera=(), microphone=(), geolocation=()" always;
    }

    # Cache long pour les assets hashés par Vite (immutables entre builds).
    # add_header dans un location annule ceux du server : on les répète.
    location ^~ /assets/ {
        expires 1y;
        add_header Cache-Control "public, immutable";
        add_header X-Content-Type-Options "nosniff" always;
    }

    # Images, vidéos et CV : cache d'une semaine (noms non hashés).
    location ~* \.(?:png|jpe?g|webp|svg|ico|mp4|pdf|docx)$ {
        expires 7d;
        add_header Cache-Control "public";
        add_header X-Content-Type-Options "nosniff" always;
    }

    gzip on;
    gzip_vary on;
    gzip_types text/css text/plain application/javascript image/svg+xml application/json
               application/xml application/manifest+json image/x-icon;
}
