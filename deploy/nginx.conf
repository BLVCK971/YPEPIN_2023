# Config nginx interne au conteneur : sert uniquement le build statique.
# Le TLS, le nom de domaine et le routing sont gérés par Traefik en amont
# (même VPS et même Traefik que ARC-GR) — pas de server_name ni de TLS ici.

# Empreintes des emails autorisés aux démos (64 caractères, map $demo_ok plus bas) : au-delà
# du seau par défaut (64), nginx refuse de démarrer. À déclarer avant le premier map.
map_hash_bucket_size 128;

# SEO : pages sans intérêt pour la recherche, exclues de l'index (X-Robots-Tag).
# Anciennes expérimentations (/Web, /py : pages minces, souvent sans titre) et
# CV Word (doublon du PDF, lui indexé). Valeur vide = pas d'en-tête.
map $uri $robots_tag {
    default         "";
    ~^/(Web|py)/    "noindex";
    ~\.docx$        "noindex";
}

# Démos sur autorisation : le visiteur demande l'accès (formulaire du site), Yoel
# ajoute son email (`npm run demos:acces -- ajouter <email>`), puis le visiteur saisit
# son email : le site pose le cookie demo_acces = SHA-256("ypepin-demos:" + email).
# La liste des empreintes autorisées vit sur le VPS, hors du dépôt public
# (/opt/apps/ypepin-acces/*.map, monté en lecture seule, lignes `<empreinte> 1;`).
# Glob : aucun fichier = personne n'a accès, mais nginx démarre.
map $cookie_demo_acces $demo_ok {
    default 0;
    include /etc/nginx/demos-acces/*.map;
}

# Démo demandée sans accès : retour sur le site (FR ou EN), qui ouvre la fenêtre d'accès.
map $http_accept_language $demo_accueil {
    default "/en/";
    ~*^fr   "/";
}

server {
    listen 80;
    server_name _;

    root /usr/share/nginx/html;
    index index.html;

    server_tokens off;
    # robots.txt, llms.txt, sitemap.xml : accents lus correctement par les robots
    charset utf-8;
    # Redirections relatives (/en -> /en/) : nginx ne voit que du HTTP derrière Traefik
    absolute_redirect off;
    autoindex off;

    add_header X-Content-Type-Options "nosniff" always;
    add_header X-Frame-Options "SAMEORIGIN" always;
    add_header Referrer-Policy "strict-origin-when-cross-origin" always;
    add_header Permissions-Policy "camera=(), microphone=(), geolocation=()" always;
    add_header X-Robots-Tag $robots_tag always;

    # Site 100 % statique : seules les méthodes de lecture sont acceptées.
    if ($request_method !~ ^(GET|HEAD)$) {
        return 405;
    }

    # Pas de fichiers cachés (.git, .env, ...)
    location ~ /\. {
        deny all;
    }

    # Pas de fallback SPA : le site est une seule page (ancres #Parcours,
    # #Portfolio) + des démos statiques dans /Web et /py.
    location / {
        try_files $uri $uri/ =404;
    }

    # Page 404 statique bilingue (public/404.html)
    error_page 404 /404.html;

    # Démos interactives des projets clients (public/demos/, voir demos/build.mjs) :
    # applications React à routeur, d'où un fallback SPA propre à chaque démo.
    # Hors index (noindex) : ce sont des copies de démonstration de sites réels.
    # add_header dans un location annule ceux du server : on les répète.
    # Accès réservé aux emails autorisés (map $demo_ok ci-dessus).
    location ~ ^/demos/(?<demo>arc-gr|matheva|hellboy|aivocat|wondo)/ {
        if ($demo_ok = 0) {
            return 302 "$demo_accueil?demo=$demo#Projets";
        }
        try_files $uri /demos/$demo/index.html;
        add_header Cache-Control "no-cache" always;
        add_header X-Robots-Tag "noindex, nofollow" always;
        add_header X-Content-Type-Options "nosniff" always;
        add_header X-Frame-Options "SAMEORIGIN" always;
        add_header Referrer-Policy "strict-origin-when-cross-origin" always;
        add_header Permissions-Policy "camera=(), microphone=(), geolocation=()" always;

        location ~ ^/demos/[^/]+/assets/ {
            if ($demo_ok = 0) {
                return 403;
            }
            expires 1y;
            add_header Cache-Control "public, immutable";
            add_header X-Robots-Tag "noindex, nofollow" always;
            add_header X-Content-Type-Options "nosniff" always;
        }
    }

    # Vérification de l'email saisi sur le site (cookie demo_acces) : 204 autorisé, 403 sinon.
    location = /demos/verif {
        add_header Cache-Control "no-store" always;
        add_header X-Robots-Tag "noindex, nofollow" always;
        add_header X-Content-Type-Options "nosniff" always;
        if ($demo_ok) {
            return 204;
        }
        return 403;
    }

    # Pages principales (prérendues au build, / et /en/) : CSP stricte. Les démos /Web et /py
    # chargent des scripts externes (CDN pygame-web...) et n'ont donc pas cette CSP.
    # add_header dans un location annule ceux du server : on les répète.
    location ~ ^/(en/)?index\.html$ {
        # /index.html et /en/index.html : doublons de / et /en/ (URL canonique).
        # $request_uri est l'URL demandée : la redirection interne / -> /index.html n'est pas concernée.
        if ($request_uri ~ "^/(en/)?index\.html") {
            return 301 /$1;
        }
        add_header Content-Security-Policy "default-src 'self'; script-src 'self'; style-src 'self' 'unsafe-inline'; img-src 'self' data:; media-src 'self'; font-src 'self'; connect-src 'self' https://api.web3forms.com; object-src 'none'; base-uri 'self'; form-action 'none'; frame-ancestors 'self'; upgrade-insecure-requests" always;
        add_header Cache-Control "no-cache" always;
        add_header X-Content-Type-Options "nosniff" always;
        add_header X-Frame-Options "SAMEORIGIN" always;
        add_header Referrer-Policy "strict-origin-when-cross-origin" always;
        add_header Permissions-Policy "camera=(), microphone=(), geolocation=()" always;
    }

    # Cache long pour les assets hashés par Vite (immutables entre builds).
    # add_header dans un location annule ceux du server : on les répète.
    location ^~ /assets/ {
        expires 1y;
        add_header Cache-Control "public, immutable";
        add_header X-Content-Type-Options "nosniff" always;
    }

    # Images, vidéos et CV : cache d'une semaine (noms non hashés).
    location ~* \.(?:png|jpe?g|webp|svg|ico|mp4|pdf|docx)$ {
        expires 7d;
        add_header Cache-Control "public";
        add_header X-Content-Type-Options "nosniff" always;
        add_header X-Robots-Tag $robots_tag always;
    }

    # Niveau 6 : HTML prérendu ~25 % plus léger qu'au niveau 1 par défaut.
    # text/xml : type servi pour sitemap.xml.
    gzip on;
    gzip_vary on;
    gzip_comp_level 6;
    gzip_types text/css text/plain text/xml application/javascript image/svg+xml application/json
               application/xml application/manifest+json image/x-icon;
}
